<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamaDigi | Jasa Deploy</title>
    
    <!-- Meta Tags untuk SEO dan Link Preview -->
    <meta name="description" content="Jasa Joki Deploy & Custom Domain by SAMA DIGI">
    <meta property="og:title" content="SamaDeploy App">
    <meta property="og:description" content="Solusi teknis cepat dan aman untuk deploy aplikasi Anda.">
    
    <!-- Favicon (Opsional, ganti href dengan link ikon Anda) -->
    <link rel="icon" type="image/png" href="https://via.placeholder.com/32">

    <style>
        /* Reset margin dan pastikan tinggi 100% dari layar */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden; /* Mencegah munculnya scrollbar ganda */
            background-color: #050508; /* Warna background SamaDigi saat iframe loading */
        }

        /* Iframe dibuat menutupi seluruh layar tanpa border */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading indicator ringan sebelum iframe termuat sepenuhnya */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f3ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            z-index: -1;
        }
    </style>
</head>
<body>
    
    <div id="loader">Memuat Aplikasi...</div>

    <!-- Iframe URL Google Apps Script Anda -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbwpmVdrUa6l-AnFIZO_07h1o3gVBFOg6P8zEU8nrJ7tSwry9Ymprf4KLTwYXAS4EzPWtQ/exec" 
        allowfullscreen="true" 
        allow="camera; microphone; fullscreen; display-capture" 
        title="SamaDeploy App">
    </iframe>

</body>
</html>
